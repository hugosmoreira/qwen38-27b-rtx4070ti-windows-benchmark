[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen38-windows-bench"
version = "0.1.0"
description = "Auditable Windows benchmark harness for local Qwen3.8 GGUF inference"
readme = "README.md"
requires-python = ">=3.11,<3.15"
authors = [{ name = "Hugo Moreira", email = "hugo@webstudiolabs.com" }]
license = { file = "LICENSE" }
dependencies = []
keywords = ["benchmark", "gguf", "llama.cpp", "qwen", "windows"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: GPU :: NVIDIA CUDA",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
qwen-bench = "qwen_bench.cli:main"

[project.urls]
Homepage = "https://github.com/hugosmoreira/qwen38-27b-rtx4070ti-windows-benchmark"
Repository = "https://github.com/hugosmoreira/qwen38-27b-rtx4070ti-windows-benchmark"
Issues = "https://github.com/hugosmoreira/qwen38-27b-rtx4070ti-windows-benchmark/issues"

[tool.setuptools.packages.find]
where = ["src"]
